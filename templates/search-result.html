<!doctype html>
<!--
  App Store search result, still image: 3840 x 2560 PNG (3:2), no alpha.
  Apple's safe area: x 837-3003, y 765-1795 (0.218-0.782, 0.299-0.701). Every device shows it; put art and text there.
  Shown about 370 pt wide in search, so the headline needs ~180 px on this canvas to read at ~17 pt.
  Headline: at most 6 words, specific and checkable (a count, a format). No price, URL, award, "best" or "#1".
  Check with: render.mjs ... --guides search
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=block">
<style>
  :root { --bg: #F2542D; --ink: #101217; --soft: rgba(255,255,255,.17); --ghost: rgba(255,255,255,.10); }
  html, body { margin: 0; }
  .canvas {
    position: relative; width: 3840px; height: 2560px; overflow: hidden;
    background: radial-gradient(ellipse 70% 80% at 50% 0%, rgba(255,255,255,.16), rgba(255,255,255,0) 70%), var(--bg);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  }
  .ghost { position: absolute; border-radius: 26%; background: var(--ghost); }
  h1 {
    position: absolute; left: 0; right: 0; top: 800px; margin: 0; text-align: center;
    color: var(--ink); font-weight: 800; font-size: 184px; line-height: 1.04; letter-spacing: -0.025em;
  }
  .focal { position: absolute; left: 50%; top: 1530px; transform: translate(-50%, -50%); display: flex; gap: 88px; align-items: center; }
  .tile { width: 270px; height: 270px; border-radius: 71px; display: grid; place-items: center; background: var(--soft); color: rgba(255,255,255,.78); font-weight: 800; font-size: 144px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="ghost" style="width:700px;height:700px;left:-120px;top:-160px;transform:rotate(-14deg)"></div>
  <div class="ghost" style="width:420px;height:420px;left:330px;top:1980px;transform:rotate(9deg)"></div>
  <div class="ghost" style="width:460px;height:460px;left:3240px;top:180px;transform:rotate(-10deg)"></div>
  <div class="ghost" style="width:760px;height:760px;left:3180px;top:1900px;transform:rotate(11deg)"></div>

  <!-- No trailing periods: at this size they float away from the word. -->
  <h1>Headline line one<br>Headline line two</h1>

  <div class="focal">
    <!-- ART: the same motif as the header, smaller. -->
    <div class="tile">A</div>
    <div class="tile">B</div>
    <div class="tile" style="background:#fff;color:var(--ink)">C</div>
    <div class="tile">D</div>
  </div>
</div>
</body>
</html>
